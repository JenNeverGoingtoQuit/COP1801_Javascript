<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 5 Assignment</title>
</head>
<body>
    <h1>Module 5 JavaScript Objects</h1>
    <div id="output"></div>

    <script>
        // ==========================================
        // Step 1: Create a literal object named myDog
        // ==========================================
        let myDog = {
            name: "Snoopy",
            show: "Charlie Brown",
            breed: "Beagle",
            role: "the pet dog of Charlie Brown",
            mySound: "I may be a small beagle, but I have a huge imagination and a lot to say."
        };

        // ==========================================
        // Step 2: Display the literal object values
        // ==========================================
        document.getElementById("output").innerHTML +=
            "<p>Hello, my name is " + myDog.name + ". " +
            myDog.mySound + " I starred in " + myDog.show +
            ". My character is a " + myDog.breed +
            ". I am " + myDog.role + ".</p>";

        // ==========================================
        // Step 3: Create a constructor function
        // ==========================================
        function Dog(name, show, breed, role, mySound, canTalk) {
            this.name = name;
            this.show = show;
            this.breed = breed;
            this.role = role;
            this.mySound = mySound;
            this.canTalk = canTalk;

            // ==========================================
            // Step 4: Add a method named myGreeting
            // ==========================================
            this.myGreeting = function() {
                return "Hello, my name is " + this.name + ". " +
                       this.mySound + " I starred in " + this.show +
                       ". My character is a " + this.breed +
                       ". I am " + this.role +
                       ". Can I talk? " + this.canTalk + ".";
            };
        }

        // ==========================================
        // Step 5: Create a constructor object named myDogConst
        // ==========================================
        let myDogConst = new Dog(
            "Snoopy",
            "Charlie Brown",
            "Beagle",
            "the pet dog of Charlie Brown",
            "I may be a small beagle, but I have a huge imagination and a lot to say.",
            false
        );

        // ==========================================
        // Step 6: Call the object method
        // ==========================================
        document.getElementById("output").innerHTML +=
            "<p>" + myDogConst.myGreeting() + "</p>";
    </script>
</body>
</html>
